<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerio · Clickable prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prototype.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 500px at 20% 10%, #E6F0FF, transparent 60%), radial-gradient(700px 500px at 90% 90%, #FFF1EC, transparent 60%), #F5F7FC; font-family: var(--font); }
  .wrap { display: flex; gap: 36px; align-items: center; padding: 30px; flex-wrap: wrap; justify-content: center; }
  .side { width: 300px; color: var(--ink); }
  .side h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -.03em; }
  .side p { color: var(--muted); line-height: 1.55; margin: 0 0 18px; font-size: 14.5px; }
  .links { display: grid; gap: 6px; }
  .links button { text-align: left; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--body); }
  .links button:hover { background: #fff; }
  .links button.on { background: #fff; color: var(--blue); box-shadow: var(--sh); }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
  .embed .side { display: none; }
  .embed body, body.embed { background: transparent; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone"><div class="screen" id="screen"></div></div>
  <div class="side">
    <h1>Aerio ✈</h1>
    <p>Clickable prototype of a flight booking app: search, compare fares, pick a seat, pay and fly with a digital boarding pass.</p>
    <div class="links" id="links"></div>
    <div class="hint">Tap anything in the phone. <b>Esc</b> or <b>←</b> goes back.</div>
  </div>
</div>
<script src="prototype.js"></script>
<script>
  if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
  const links = document.getElementById("links");
  links.innerHTML = Object.entries(Aerio.TITLES).map(([k, t]) => `<button data-screen-link="${k}">${t}</button>`).join("");
  links.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) Aerio.go(b.dataset.screenLink); });
  Aerio.render();
</script>
</body>
</html>
